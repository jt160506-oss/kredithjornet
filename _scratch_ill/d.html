<main id="main"><div class="article-wrap article-body" style="padding:40px 0">

<!-- nedkonvertering: faldende rente -->
<figure class="editorial-illustration ill-ratedown is-reverse" aria-labelledby="d1">
  <figcaption class="illustration-copy">
    <span class="illustration-kicker">Når renten er faldet</span>
    <h3 id="d1">Nedkonvertering skifter til en lavere rente</h3>
    <p>Er markedsrenten faldet under din nuværende, kan du lægge om til et billigere lån og sænke ydelsen. Omkostningerne skal veje op mod gevinsten over din tidshorisont.</p>
    <div class="illustration-points" aria-hidden="true"><span><i></i>Faldende rente</span><span><i></i>Lavere ydelse</span><span><i></i>Omkostninger</span></div>
  </figcaption>
  <div class="illustration-stage">
    <svg viewBox="0 0 560 330" role="img" aria-label="Graf hvor renten falder over tid">
      <defs><filter id="d1s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#102B46" flood-opacity=".14"/></filter></defs>
      <circle cx="112" cy="80" r="56" fill="#CDEDE0" opacity=".8"/><circle cx="466" cy="262" r="66" fill="#F4D486" opacity=".44"/>
      <g filter="url(#d1s)"><rect x="70" y="66" width="360" height="200" rx="24" fill="#FFFFFF" stroke="#D8E4DC"/>
        <line x1="104" y1="98" x2="104" y2="222" stroke="#E4EAE4" stroke-width="2"/>
        <line x1="104" y1="222" x2="404" y2="222" stroke="#E4EAE4" stroke-width="2"/>
        <path d="M116 118C170 122 210 150 250 178S330 210 392 206" fill="none" stroke="#42D5A0" stroke-width="6" stroke-linecap="round"/>
        <circle cx="116" cy="118" r="9" fill="#FFFFFF" stroke="#176453" stroke-width="4"/>
        <circle cx="392" cy="206" r="11" fill="#0F3F35"/><path d="m386 206 4 4 8-9" fill="none" stroke="#42D5A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="124" y="110" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="700" fill="#102B46">4,0 %</text>
        <text x="360" y="196" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="700" fill="#176453">3,0 %</text>
      </g>
      <g class="visual-float" transform="translate(300 60)"><rect width="150" height="42" rx="14" fill="#102B46"/><circle cx="21" cy="21" r="9" fill="#42D5A0"/><path d="M17 18l4 6 5-4" fill="none" stroke="#102B46" stroke-width="2"/><text x="38" y="25" font-family="DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#fff">Faldende rente</text></g>
    </svg>
  </div>
</figure>

<!-- skifte-omkostninger: oversigt -->
<figure class="editorial-illustration ill-costs" aria-labelledby="d2">
  <figcaption class="illustration-copy">
    <span class="illustration-kicker">Hvad et bankskifte koster</span>
    <h3 id="d2">Læg omkostningerne op mod gevinsten</h3>
    <p>Et skifte kan koste tinglysning, vurdering og indfrielse af det gamle lån. Tallene skal stilles op mod, hvad du sparer på de nye vilkår — så du ved, hvornår det betaler sig.</p>
    <div class="illustration-points" aria-hidden="true"><span><i></i>Tinglysning</span><span><i></i>Vurdering</span><span><i></i>Indfrielse</span></div>
  </figcaption>
  <div class="illustration-stage">
    <svg viewBox="0 0 560 330" role="img" aria-label="Oversigt over omkostninger ved bankskifte">
      <defs><filter id="d2s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#102B46" flood-opacity=".14"/></filter></defs>
      <circle cx="440" cy="80" r="56" fill="#F4D486" opacity=".48"/><circle cx="86" cy="266" r="66" fill="#CDEDE0" opacity=".8"/>
      <g filter="url(#d2s)"><rect x="150" y="52" width="240" height="226" rx="20" fill="#FFFFFF" stroke="#D8E4DC"/>
        <text x="174" y="88" font-family="DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#102B46">Omkostninger ved skifte</text>
        <g font-family="DM Sans, Inter, sans-serif" font-size="12.5" font-weight="600" fill="#53636D">
          <text x="174" y="122">Tinglysning</text><text x="366" y="122" text-anchor="end" fill="#324B55" font-weight="700">1.730</text>
          <text x="174" y="150">Vurdering</text><text x="366" y="150" text-anchor="end" fill="#324B55" font-weight="700">1.500</text>
          <text x="174" y="178">Indfrielse</text><text x="366" y="178" text-anchor="end" fill="#324B55" font-weight="700">2.200</text>
        </g>
        <line x1="174" y1="196" x2="366" y2="196" stroke="#E4EAE4" stroke-width="2"/>
        <rect x="174" y="210" width="192" height="44" rx="12" fill="#DDF3E9"/>
        <text x="190" y="238" font-family="DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#176453">Vejl. i alt</text>
        <text x="350" y="238" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="700" fill="#0F3F35" text-anchor="end">5.430 kr</text>
      </g>
      <g class="visual-float" transform="translate(354 150)"><rect width="150" height="46" rx="14" fill="#0F3F35"/><circle cx="24" cy="23" r="10" fill="#42D5A0"/><path d="m20 23 3 3 5-7" fill="none" stroke="#0F3F35" stroke-width="2"/><text x="42" y="28" font-family="DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#fff">Vej mod gevinst</text></g>
      <text x="70" y="150" font-family="DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#93A0A8">Eksempel</text>
    </svg>
  </div>
</figure>

<!-- konverteringsberegner: før/efter -->
<figure class="editorial-illustration ill-compare is-reverse" aria-labelledby="d3">
  <figcaption class="illustration-copy">
    <span class="illustration-kicker">Se gevinsten ved en omlægning</span>
    <h3 id="d3">Stil den nuværende ydelse op mod den nye</h3>
    <p>Beregneren sammenligner dit nuværende lån med et nyt og viser forskellen i ydelse — sat op mod omkostningerne, så du kan se, om omlægningen reelt kan betale sig.</p>
    <div class="illustration-points" aria-hidden="true"><span><i></i>Nuværende</span><span><i></i>Nyt lån</span><span><i></i>Gevinst</span></div>
  </figcaption>
  <div class="illustration-stage">
    <svg viewBox="0 0 560 330" role="img" aria-label="Sammenligning af nuværende og ny ydelse">
      <defs><linearGradient id="d3g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42D5A0"/><stop offset="1" stop-color="#176453"/></linearGradient><filter id="d3s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#102B46" flood-opacity=".14"/></filter></defs>
      <circle cx="110" cy="80" r="56" fill="#F4D486" opacity=".46"/><circle cx="466" cy="262" r="66" fill="#CDEDE0" opacity=".8"/>
      <g filter="url(#d3s)"><rect x="70" y="70" width="380" height="196" rx="24" fill="#FFFFFF" stroke="#D8E4DC"/>
        <text x="98" y="112" font-family="DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#788A91">Nuværende ydelse</text>
        <rect x="98" y="122" width="300" height="26" rx="13" fill="#EEF1EC"/>
        <rect x="98" y="122" width="300" height="26" rx="13" fill="#C8D3CD"/>
        <text x="384" y="140" font-family="DM Sans, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#324B55" text-anchor="end">13.900</text>
        <text x="98" y="184" font-family="DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#176453">Ny ydelse</text>
        <rect x="98" y="194" width="300" height="26" rx="13" fill="#EEF1EC"/>
        <rect x="98" y="194" width="238" height="26" rx="13" fill="url(#d3g)"/>
        <text x="322" y="212" font-family="DM Sans, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="end">12.480</text>
      </g>
      <g class="visual-float" transform="translate(300 60)"><rect width="150" height="42" rx="14" fill="#102B46"/><circle cx="21" cy="21" r="9" fill="#42D5A0"/><path d="m17 21 3 3 5-7" fill="none" stroke="#102B46" stroke-width="2"/><text x="38" y="25" font-family="DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#fff">Gevinst pr. måned</text></g>
    </svg>
  </div>
</figure>

</div></main></body></html>
