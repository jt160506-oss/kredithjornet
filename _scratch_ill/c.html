<!-- 3 enkeltmandsvirksomhed: bundlinjen -->
<figure class="editorial-illustration ill-ledger" aria-labelledby="i3">
  <figcaption class="illustration-copy">
    <span class="illustration-kicker">Sådan læser banken din virksomhed</span>
    <h3 id="i3">Det er bundlinjen, banken regner på</h3>
    <p>Ved enkeltmandsvirksomhed ser banken på dit overskud før skat — omsætning minus udgifter — ikke omsætningen alene. En solid bundlinje vejer tungere end et højt salg.</p>
    <div class="illustration-points" aria-hidden="true"><span><i></i>Omsætning</span><span><i></i>Udgifter</span><span><i></i>Overskud</span></div>
  </figcaption>
  <div class="illustration-stage">
    <svg viewBox="0 0 560 330" role="img" aria-label="Regnskab hvor omsætning minus udgifter giver overskuddet">
      <defs><filter id="i3s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#102B46" flood-opacity=".14"/></filter></defs>

        <text x="196" y="214" font-family="DM Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#8FC7B4">Overskud før skat</text>
